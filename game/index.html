<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#185c43">
  <meta name="description" content="A simple touchscreen block puzzle with adjustable Bluetooth juice rewards at 90 mL/min.">
  <title>Block fit · Pump play</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <!-- STYLES -->
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>Block fit<span class="brand-dot" aria-hidden="true"></span></h1>
      <div class="top-actions"><button id="pause" class="stop">Pause</button><button id="fullscreen" class="quiet" aria-label="Enter full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
    </header>
    <section class="pump-controls" aria-label="Juice controls">
      <div class="connection-actions"><button id="connect" class="secondary">Connect pump</button><button id="disconnect" class="secondary" hidden>Disconnect</button></div>
      <label class="dose-field" for="reward-ml">mL per trial<input id="reward-ml" type="number" min="0.15" max="90" step="any" inputmode="decimal" placeholder="Enter mL" aria-describedby="dose-preview"></label>
      <button id="start-rewards" disabled>Start with juice</button>
      <div class="pump-meta"><span id="connection-label" role="status">Not connected</span><span id="dose-preview">Estimated at 90 mL/min</span></div>
      <p id="support-note" class="help" hidden></p>
    </section>
    <section class="game" aria-label="Block puzzle">
      <div class="play-heading"><div><h2 id="feedback">Fit the blocks.</h2><p id="message" role="status" aria-live="polite">Drag a block into its matching space.</p></div><div id="progress" class="progress" role="img" aria-label="0 of 3 blocks fitted"><span></span><span></span><span></span></div></div>
      <div class="board-wrap">
        <div id="board" class="puzzle-board" role="group" aria-label="Matching spaces"></div>
        <div id="overlay" class="board-overlay" hidden><h2>Paused</h2><p id="overlay-description">Tap Resume to keep playing.</p></div>
      </div>
      <div id="tray" class="piece-tray" role="group" aria-label="Blocks to fit"></div>
      <p class="tap-hint">Or tap a block, then its space.</p>
    </section>
    <footer class="session-status"><span class="mode-row"><span id="mode-dot" class="status-dot"></span><span id="mode">Practice mode</span></span><span id="footer-note">Juice rewards are off.</span><button id="practice" class="text-button" hidden>Play practice</button><a href="/pump/">Juice button &amp; settings</a></footer>
  </main>
  <noscript><p class="notice">Enable JavaScript to play the block puzzle.</p></noscript>
  <!-- SCRIPT -->
</body>
</html>
